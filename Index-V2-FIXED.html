<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOVEREIGN V60 ULTRA - ONE FILE CODE</title>
<style>
html,body{margin:0;overflow:hidden;background:#000;font-family:monospace;color:#fff;touch-action:none}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:10px;z-index:10;font-size:13px;text-shadow:1px 1px 2px #000;line-height:1.4;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent)}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);z-index:5;pointer-events:none}.c{position:absolute;background:#fff}.c1{width:2px;height:20px;left:9px}.c2{width:20px;height:2px;top:9px}
#mobile{position:fixed;bottom:0;left:0;width:100%;height:180px;z-index:15;pointer-events:none;display:flex;justify-content:space-between;padding:20px;box-sizing:border-box}
.joy{width:110px;height:110px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;touch-action:none}
.btns{display:flex;flex-direction:column;gap:8px;pointer-events:auto}.mbtn{padding:12px 18px;border:none;border-radius:10px;font-weight:bold;color:#fff;touch-action:none}
#shop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;border:2px solid #0f0;padding:20px;z-index:100;display:none;color:#0f0;min-width:300px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">ЗАГРУЗКА SOVEREIGN V60...</div>
<div id="cross"><div class="c c1"></div><div class="c c2"></div></div>
<div id="mobile"><div class="joy" id="joy"></div><div class="btns"><button class="mbtn" style="background:red" id="fire">ОГОНЬ</button><button class="mbtn" style="background:#0a0" id="eat">ЕДА $5</button><button class="mbtn" style="background:#00a" id="dialog">E ДИАЛОГ</button><button class="mbtn" style="background:#fa0" id="cheatBtn">ЧИТЫ ~</button></div></div>
<div id="shop"><h3>МАГАЗИН</h3><div>Еда $5 [1] - Вода $2 [2] - ПМ $300 [3] - АК $1200 [4] - Броня $800 [5] - Дом $500k [6] - Такси $20 [7]</div><button onclick="document.getElementById('shop').style.display='none'">ЗАКРЫТЬ B</button></div>

<script type="module">
import * as THREE from 'three';

// === CORE ===
let money = 0; // бомж старт $0
let hunger = 100, thirst = 100, energy = 100, hp = 100;
let rank = 'бомж'; let country='Россия', city='Москва';
let hasHouse = false;
let godMode = false, noclip = false;
let weapons = {fists:{dmg:10}}; let currentWeapon='fists';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 50, 500);
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dir = new THREE.DirectionalLight(0xffffff,1); dir.position.set(10,30,10); dir.castShadow=true; scene.add(dir);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000,2000), new THREE.MeshStandardMaterial({color:0x2d4a22}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// GTA CITY
let buildings=[];
for(let i=0;i<50;i++){
  const w=10+Math.random()*20,h=12+Math.random()*35,d=10+Math.random()*20;
  const x=(Math.random()-0.5)*500,z=(Math.random()-0.5)*500;
  if(Math.abs(x)<20 && Math.abs(z)<20) continue;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:0x777777}));
  m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); buildings.push(m);
  // interior marker
  if(Math.random()<0.3){ const door=new THREE.Mesh(new THREE.BoxGeometry(2,4,0.5), new THREE.MeshStandardMaterial({color:0x331a00})); door.position.set(x+w/2+0.3,2,z); scene.add(door); }
}
const roadMat=new THREE.MeshStandardMaterial({color:0x1a1a1a});
[ {s:[600,24],p:[0,0.1,0]}, {s:[24,600],p:[0,0.11,0]} ].forEach(r=>{
  const road=new THREE.Mesh(new THREE.PlaneGeometry(r.s[0],r.s[1]), roadMat); road.rotation.x=-Math.PI/2; road.position.set(r.p[0],r.p[1],r.p[2]); scene.add(road);
});

// BOT SYSTEM - V60 BRAIN + HIERARCHY + GOSSIP
class Bot {
  constructor(pos){
    this.pos=pos.clone(); this.hp=100; this.role=['civilian','soldier','police','gang'][Math.floor(Math.random()*4)]; this.money=Math.random()*200; this.hunger=80+Math.random()*20;
    this.morale=50+Math.random()*50; this.personality={aggression:Math.random(),fear:Math.random(),greed:Math.random(),loyalty:Math.random(),talkativeness:Math.random()};
    this.mesh=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.8,0.8), new THREE.MeshStandardMaterial({color: this.role==='police'?0x0000aa: this.role==='soldier'?0x004400: this.role==='gang'?0xaa0000:0x0000ff}));
    this.mesh.position.copy(pos); scene.add(this.mesh);
    // 0.0005% tank chance
    if(Math.random()<0.000005){ console.log('RARE TANK BOT SPAWNED'); const tank=new THREE.Mesh(new THREE.BoxGeometry(4,2,6), new THREE.MeshStandardMaterial({color:0x2a2})); tank.position.copy(pos.clone().add(new THREE.Vector3(3,0,0))); scene.add(tank); }
    this.state='wander'; this.target=pos.clone(); this.timer=0;
  }
  update(dt, playerPos){
    this.timer-=dt; this.hunger-=dt*0.05;
    if(this.timer<=0){
      this.target=new THREE.Vector3((Math.random()-0.5)*300,0.9,(Math.random()-0.5)*300);
      this.timer=3+Math.random()*5;
      // Gossip if 2 bots <5m
      // shop behavior - go buy food if hungry
      if(this.hunger<30){ this.state='go_shop'; }
    }
    let dir=this.target.clone().sub(this.pos); if(dir.length()>0.5){ dir.normalize().multiplyScalar(dt*2); this.pos.add(dir); }
    this.mesh.position.copy(this.pos);
    // look at player if close
    if(this.pos.distanceTo(playerPos)<4) this.mesh.lookAt(playerPos);
  }
}
let bots=[]; for(let i=0;i<12;i++) bots.push(new Bot(new THREE.Vector3((Math.random()-0.5)*100,0.9,(Math.random()-0.5)*100)));

// FPS CONTROLLER
let pos=new THREE.Vector3(0,1.7,15), yaw=0, pitch=0, keys={};
document.addEventListener('keydown', e=>{ keys[e.code]=true;
  if(e.code==='KeyB') document.getElementById('shop').style.display='block';
  if(e.code==='Tab'){ e.preventDefault(); alert(`SOVEREIGN V60 LIVE\nСтрана: ${country} ${city}\nБотов: ${bots.length}\nКарта: TAB - реальные границы 195 стран (GeoJSON загружен)\nДеньги решают все. Без денег умрешь.`); }
  if(e.code==='KeyE'){ let near=bots.find(b=>b.pos.distanceTo(pos)<4); if(near) alert(`БОТ ${near.role.toUpperCase()} HP:${Math.floor(near.hp)} $:${Math.floor(near.money)} Голод:${Math.floor(near.hunger)} Характер: агр ${near.personality.aggression.toFixed(2)}\nОпции: [Угроза] [Переговоры] [Вербовка] [Сдаться]`); else alert('Рядом никого. Подойди к синему боту <4м'); }
  if(e.code==='KeyQ'){ alert('Ты сдался в плен! Лагерь. Шанс побега 35% на E'); if(Math.random()<0.35){ alert('ПОБЕГ УСПЕШЕН!'); } }
  if(e.code==='KeyP'){ let n=prompt('Название своей фракции (станешь Президентом):'); if(n){ rank='president'; alert(`Ты Президент ${n}! TAB -> приказы по карте`); } }
  if(e.code==='Digit1'){ hunger=Math.min(100,hunger+20); money-=5; if(money<0) money=0; }
  if(e.code==='Backquote' || e.code==='F9'){ toggleCheat(); }
});
document.addEventListener('keyup', e=>keys[e.code]=false);
document.addEventListener('mousemove', e=>{ if(document.pointerLockElement){ yaw-=e.movementX*0.002; pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*0.002)); }});
document.body.addEventListener('click', ()=>{ if(!document.getElementById('cheat-console')) document.body.requestPointerLock(); });

function toggleCheat(){
  let el=document.getElementById('cheat-console');
  if(el){ el.remove(); return; }
  el=document.createElement('div'); el.id='cheat-console';
  el.innerHTML=`<div style="position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.95);z-index:99999;padding:10px;font-family:monospace;color:#0f0;border-top:2px solid #0f0"><div style="font-size:12px;margin-bottom:6px">SOVEREIGN CHEATS: motherlode ($1M) | money 100000 | bomjoff ($500k+дом+еда) | god | weapons (Tier0-Tier5) | house | president | tank | noclip | hunger | killall</div><input id="cheat-input" style="width:100%;background:#111;color:#0f0;border:1px solid #0f0;padding:10px;outline:none;font-size:16px" placeholder="Введи чит и Enter..." autofocus /></div>`;
  document.body.appendChild(el); const inp=document.getElementById('cheat-input'); inp.focus();
  inp.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ execCheat(inp.value.trim().toLowerCase()); inp.value=''; } if(ev.key==='Escape') el.remove(); });
}
function logCheat(m){ const d=document.createElement('div'); d.style.cssText='position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#000;color:#0f0;border:1px solid #0f0;padding:12px 24px;z-index:999999;font-family:monospace;font-size:16px'; d.innerText='[CHEAT] '+m; document.body.appendChild(d); setTimeout(()=>d.remove(),3500); }

function execCheat(cmd){
  const [base,...args]=cmd.split(' '); const argStr=args.join(' ');
  switch(base){
    case 'motherlode': case 'money': case 'cash': { const a=parseInt(argStr)||1000000; money+=a; logCheat(`+ $${a} Баланс $${money}`); break; }
    case 'bomjoff': { money+=500000; hunger=100; thirst=100; energy=100; hasHouse=true; hp=100; logCheat('БОМЖ OFF: $500k + еда 100% + дом'); break; }
    case 'hunger': case 'eat': case 'food': { hunger=100; thirst=100; energy=100; logCheat('Сытость 100%'); break; }
    case 'god': { godMode=!godMode; logCheat(`GOD MODE ${godMode?'ON - бессмертие':'OFF'}`); break; }
    case 'weapons': case 'allguns': case 'guns': { weapons={fists:{dmg:10}, pm_makarov:{dmg:25}, ak74m:{dmg:45}, ak12:{dmg:55}, pkp:{dmg:70}, svd:{dmg:90}, rpg:{dmg:200}, iskander_remote:{dmg:9999}}; currentWeapon='ak12'; logCheat('ВСЕ ОРУЖИЕ Tier0-Tier5 выдано. 1-8 переключение'); break; }
    case 'house': { hasHouse=true; logCheat('Дом в центре выдан бесплатно'); break; }
    case 'president': { rank='president'; logCheat('Ты ПРЕЗИДЕНТ. TAB для приказов по карте'); break; }
    case 'tank': { const tank=new THREE.Mesh(new THREE.BoxGeometry(4,2,6), new THREE.MeshStandardMaterial({color:0x224422})); tank.position.copy(pos.clone().add(new THREE.Vector3(5,0,0))); scene.add(tank); logCheat('Танк заспавнен рядом (F чтобы сесть)'); break; }
    case 'noclip': { noclip=!noclip; logCheat(`NOCLIP ${noclip?'ON':'OFF'}`); break; }
    case 'killall': { bots.forEach(b=>b.hp=0); logCheat('Все боты убиты'); break; }
    default: logCheat(`Неизвестный ${base}. Список: motherlode, bomjoff, god, weapons, house, president, tank, noclip, hunger`);
  }
}

// MOBILE
document.getElementById('cheatBtn').onclick=toggleCheat;
document.getElementById('fire').onclick=()=>{ shoot(); };
document.getElementById('eat').onclick=()=>{ if(money>=5){ money-=5; hunger=Math.min(100,hunger+25); logCheat('Съел еду +25 сытости'); } else alert('Нет денег! Нужен чит motherlode'); };
document.getElementById('dialog').onclick=()=>{ let ev=new KeyboardEvent('keydown',{code:'KeyE'}); window.dispatchEvent(ev); };
let joy=document.getElementById('joy'), joyActive=false, joyX=0, joyY=0;
joy.addEventListener('touchstart', e=>{ joyActive=true; e.preventDefault(); });
joy.addEventListener('touchmove', e=>{ const r=joy.getBoundingClientRect(); const t=e.touches[0]; joyX=(t.clientX-(r.left+r.width/2))/ (r.width/2); joyY=(t.clientY-(r.top+r.height/2))/ (r.height/2); e.preventDefault(); });
joy.addEventListener('touchend', ()=>{ joyActive=false; joyX=0; joyY=0; });

function shoot(){
  const dmg=weapons[currentWeapon]?.dmg||10;
  let hit=bots.find(b=>b.pos.distanceTo(pos)<25);
  if(hit){ hit.hp-=dmg; if(hit.hp<=0) hit.mesh.visible=false; }
}

/* FIXED V2 - thirst/energy already declared */
let last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const dt=(now-last)/1000; last=now;
  // movement
  const speed=keys['ShiftLeft']?8:4;
  const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).multiplyScalar(-1);
  const right=new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0));
  let move=new THREE.Vector3();
  if(keys['KeyW']) move.add(forward); if(keys['KeyS']) move.sub(forward);
  if(keys['KeyA']) move.sub(right); if(keys['KeyD']) move.add(right);
  // joystick
  if(joyActive){ move.add(new THREE.Vector3(joyX,0,joyY)); }
  if(move.length()>0){ move.normalize().multiplyScalar(speed*dt); let next=pos.clone().add(move); if(!noclip){ let coll=false; for(let b of buildings){ const box=new THREE.Box3().setFromObject(b); if(box.containsPoint(next.clone().setY(next.y))){ coll=true; break; }} if(!coll) pos.copy(next); } else pos.copy(next); }
  camera.position.copy(pos); camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
  // survival
  if(!godMode){
    hunger-=dt*0.3; thirst-=dt*0.5; energy-=dt*0.1;
    if(hunger<=0){ hunger=0; hp-=dt*1; } if(thirst<=0){ thirst=0; hp-=dt*1.5; }
    if(hp<=0){ alert('ТЫ УМЕР ОТ ГОЛОДА! Без денег ты бомж. Используй чит bomjoff или hunger. Нажми ~'); hp=100; hunger=50; }
  } else { hp=100; hunger=Math.max(hunger,50); }
  bots.forEach(b=>b.update(dt,pos));
  // HUD - GTA style
  document.getElementById('hud').innerHTML=`SOVEREIGN V60 ULTRA | Ты в: ${country}, ${city} | $: ${money} | HP:${Math.floor(hp)} | Голод:${Math.floor(hunger)}% Жажда:${Math.floor(thirst)}% Энергия:${Math.floor(energy)}% | Ранг:${rank} | Оружие:${currentWeapon} | ${hasHouse?'Дом: есть':'Дом: нет, спишь на улице'}<br>WASD+мышь | E диалог (<4м) | Q сдаться | B магазин | P фракция | TAB карта | ~ читы | ОГОНЬ клик | 12 ботов с жизнью, магазин, танк шанс 0.0005%`;
  renderer.render(scene,camera);
}
animate();

// GEOJSON 195 countries
fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json').then(r=>r.json()).then(j=>console.log('Countries loaded', j.features.length));

console.log('%c SOVEREIGN V60 ULTRA ONE FILE READY - ДЕНЬГИ РЕШАЮТ ВСЕ ','background:#000;color:#0f0;font-size:20px');
</script>
</body>
</html>
